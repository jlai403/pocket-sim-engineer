name: Android

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - uses: android-actions/setup-android@v4

      - name: Install SDK packages
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0" "platform-tools"

      - uses: gradle/actions/setup-gradle@v6

      - name: Unit and Compose UI tests
        run: ./gradlew :core:test :app:testDebugUnitTest --stacktrace

      - name: Lint
        run: ./gradlew :app:lintDebug --stacktrace

      - name: Build debug APK
        run: ./gradlew :app:assembleDebug --stacktrace
        env:
          GITHUB_RUN_NUMBER: ${{ github.run_number }}
          GITHUB_SHA: ${{ github.sha }}
          UPDATE_CHANNEL: ${{ startsWith(github.ref, 'refs/tags/v') && 'stable' || 'preview' }}

      - name: Stage APK
        run: |
          version_name=$(sed -n 's/.*versionName = "\(.*\)"/\1/p' app/build.gradle.kts | head -1)
          version_code=$((1000 + $(git rev-list --count HEAD)))
          mkdir -p dist
          cp app/build/outputs/apk/debug/app-debug.apk \
            "dist/PocketSimEngineer-${version_name}-${version_code}-debug.apk"

      - name: Upload APK
        uses: actions/upload-artifact@v7
        with:
          name: pocketsimengineer-debug-${{ github.sha }}
          path: dist/*.apk
          if-no-files-found: error

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: test-reports-${{ github.sha }}
          path: |
            core/build/reports/tests/test
            app/build/reports/tests/testDebugUnitTest
          if-no-files-found: ignore

  preview:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/download-artifact@v8
        with:
          name: pocketsimengineer-debug-${{ github.sha }}
          path: dist

      - name: Publish preview build
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: preview-latest
        run: |
          apk=$(ls dist/*.apk | head -1)
          cp "$apk" dist/PocketSimEngineer-preview.apk
          version_name=$(sed -n 's/.*versionName = "\(.*\)"/\1/p' app/build.gradle.kts | head -1)
          version_code=$((1000 + $(git rev-list --count HEAD)))
          sha=$(sha256sum dist/PocketSimEngineer-preview.apk | cut -d' ' -f1)
          jq -n \
            --argjson code "$version_code" \
            --arg name "$version_name" \
            --arg apk "PocketSimEngineer-preview.apk" \
            --arg sha "$sha" \
            --arg notes "Preview build ${{ github.run_number }} · ${GITHUB_SHA:0:7}" \
            '{versionCode:$code,versionName:$name,apk:$apk,sha256:$sha,notes:$notes}' \
            > dist/latest.json
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/PocketSimEngineer-preview.apk dist/latest.json --clobber
          else
            gh release create "$TAG" dist/PocketSimEngineer-preview.apk dist/latest.json \
              --prerelease --title "Preview builds" \
              --notes "Rolling debug build from main. Android will ask before installing."
          fi

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/download-artifact@v8
        with:
          name: pocketsimengineer-debug-${{ github.sha }}
          path: dist

      - name: Publish stable release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          apk=$(ls dist/*.apk | head -1)
          cp "$apk" "dist/PocketSimEngineer-${TAG}.apk"
          version_name=$(sed -n 's/.*versionName = "\(.*\)"/\1/p' app/build.gradle.kts | head -1)
          version_code=$((1000 + $(git rev-list --count HEAD)))
          sha=$(sha256sum "dist/PocketSimEngineer-${TAG}.apk" | cut -d' ' -f1)
          jq -n \
            --argjson code "$version_code" \
            --arg name "$version_name" \
            --arg apk "PocketSimEngineer-${TAG}.apk" \
            --arg sha "$sha" \
            --arg notes "Stable $TAG" \
            '{versionCode:$code,versionName:$name,apk:$apk,sha256:$sha,notes:$notes}' \
            > dist/latest.json
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "dist/PocketSimEngineer-${TAG}.apk" dist/latest.json --clobber
          else
            gh release create "$TAG" "dist/PocketSimEngineer-${TAG}.apk" dist/latest.json \
              --title "$TAG" --generate-notes --latest
          fi
