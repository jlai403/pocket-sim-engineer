name: Android

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"

      - uses: android-actions/setup-android@v4

      - uses: actions/cache@v4
        with:
          path: |
            ~/.android
            ${{ env.ANDROID_HOME }}/platforms
            ${{ env.ANDROID_HOME }}/build-tools
          key: android-sdk-${{ runner.os }}-36

      - name: Install SDK packages
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0" "platform-tools"

      - uses: gradle/actions/setup-gradle@v6

      - name: Unit and Compose UI tests
        run: ./gradlew :core:test :app:testDebugUnitTest --stacktrace

  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    outputs:
      version_code: ${{ steps.version.outputs.version_code }}
      version_name: ${{ steps.version.outputs.version_name }}

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"

      - uses: android-actions/setup-android@v4

      - uses: actions/cache@v4
        with:
          path: |
            ~/.android
            ${{ env.ANDROID_HOME }}/platforms
            ${{ env.ANDROID_HOME }}/build-tools
          key: android-sdk-${{ runner.os }}-36

      - name: Install SDK packages
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0" "platform-tools"

      - uses: gradle/actions/setup-gradle@v6

      - name: Lint
        run: ./gradlew :app:lintDebug --stacktrace

      - name: Build debug APK
        run: ./gradlew :app:assembleDebug --stacktrace
        env:
          GITHUB_RUN_NUMBER: ${{ github.run_number }}
          GITHUB_SHA: ${{ github.sha }}
          UPDATE_CHANNEL: ${{ startsWith(github.ref, 'refs/tags/v') && 'stable' || 'preview' }}

      - name: Compute version
        id: version
        run: |
          version_name=$(sed -n 's/.*versionName = "\(.*\)"/\1/p' app/build.gradle.kts | head -1)
          version_code=$((1000 + $(git rev-list --count HEAD)))
          echo "version_name=$version_name" >> "$GITHUB_OUTPUT"
          echo "version_code=$version_code" >> "$GITHUB_OUTPUT"

      - name: Stage APK
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/debug/app-debug.apk \
            "dist/LapCraft-${{ steps.version.outputs.version_name }}-${{ steps.version.outputs.version_code }}-debug.apk"

      - name: Upload APK
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v7
        with:
          name: lapcraft-debug-${{ github.sha }}
          path: dist/*.apk
          if-no-files-found: error

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: lint-build-reports-${{ github.sha }}
          path: app/build/reports/lint-results-debug.html
          if-no-files-found: ignore

  preview:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [test, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/download-artifact@v8
        with:
          name: lapcraft-debug-${{ github.sha }}
          path: dist

      - name: Publish preview build
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: preview-latest
          VERSION_NAME: ${{ needs.build.outputs.version_name }}
          VERSION_CODE: ${{ needs.build.outputs.version_code }}
        run: |
          apk=$(ls dist/*.apk | head -1)
          cp "$apk" dist/LapCraft-preview.apk
          sha=$(sha256sum dist/LapCraft-preview.apk | cut -d' ' -f1)
          jq -n \
            --argjson code "$VERSION_CODE" \
            --arg name "$VERSION_NAME" \
            --arg apk "LapCraft-preview.apk" \
            --arg sha "$sha" \
            --arg notes "Preview build ${{ github.run_number }} · ${GITHUB_SHA:0:7}" \
            '{versionCode:$code,versionName:$name,apk:$apk,sha256:$sha,notes:$notes}' \
            > dist/latest.json
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/LapCraft-preview.apk dist/latest.json --clobber
          else
            gh release create "$TAG" dist/LapCraft-preview.apk dist/latest.json \
              --prerelease --title "Preview builds" \
              --notes "Rolling debug build from main. Android will ask before installing."
          fi